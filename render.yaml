services:
  # ── Backend (Express + Prisma) ──────────────────────────────────
  - type: web
    name: entron-server
    plan: free
    runtime: node
    rootDir: server
    buildCommand: npm install && cd .. && npx prisma generate && cd server && npm run build && cd .. && npx prisma migrate deploy
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SERVER_PORT
        value: 10000
      - key: SERVER_ORIGIN
        sync: false
