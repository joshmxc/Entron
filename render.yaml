databases:
  - name: entron-db
    plan: free
    databaseName: entron
    user: entron

services:
  # ── Backend (Express + Prisma) ──────────────────────────────────
  - type: web
    name: entron-server
    plan: free
    runtime: node
    rootDir: .
    buildCommand: npm install --include=dev && npx prisma generate && npm run build -w server && npx prisma migrate deploy
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: entron-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SERVER_PORT
        value: 10000
      - key: SERVER_ORIGIN
        sync: false

  # ── Frontend (Next.js) ─────────────────────────────────────────
  - type: web
    name: entron-web
    plan: free
    runtime: node
    rootDir: .
    buildCommand: npm install --include=dev && npm run build -w web
    startCommand: npm run start -w web
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        sync: false
