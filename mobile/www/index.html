<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Entron</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0a1628;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: #1e3a8a;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
      color: white;
      margin: 0 auto 16px;
      box-shadow: 0 8px 32px rgba(30,58,138,0.4);
    }
    p { color: rgba(255,255,255,0.4); font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <div>
    <div class="logo">E</div>
    <p>Loading Entron...</p>
  </div>
</body>
</html>
